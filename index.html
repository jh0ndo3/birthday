<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>誕生日の部屋からの脱出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe7ef; --ink:#1d1d1f; --sub:#5a6170; --card:#ffffff;
  --wall:#ffffff; --floor:#f4f4f2; --line:#111111; --paper:#fffef8;
  --wood:#e9d3b4; --door:#fbfbfb; --btn:#1d1d1f; --btnText:#ffffff;
  --accent:#ff5c8a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#171b24; --ink:#eef1f6; --sub:#a3abba; --card:#232a36;
    --wall:#f3f3f0; --floor:#e6e6e2; --line:#111111; --paper:#fffef8;
    --wood:#e2c9a6; --door:#fbfbfb; --btn:#eef1f6; --btnText:#171b24;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171b24; --ink:#eef1f6; --sub:#a3abba; --card:#232a36;
  --wall:#f3f3f0; --floor:#e6e6e2; --line:#111111; --paper:#fffef8;
  --wood:#e2c9a6; --door:#fbfbfb; --btn:#eef1f6; --btnText:#171b24;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top h1{font-size:1.05rem;font-weight:500;margin:0;letter-spacing:.04em}
.top .wallname{font-size:.85rem;color:var(--sub)}
.btn{font:inherit;border:2px solid var(--btn);background:var(--btn);color:var(--btnText);border-radius:999px;padding:.55em 1.2em;font-size:.95rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,.arrow:focus-visible,.close:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;border:3px solid var(--line);border-radius:6px;overflow:hidden;background:var(--wall);box-shadow:4px 4px 0 var(--line)}
.stage svg{display:block;width:100%;height:auto}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:56px;border:none;background:transparent;cursor:pointer;padding:0}
.arrow svg{width:100%;height:100%}
.arrow.l{left:0}.arrow.r{right:0}
.hit{fill:transparent;cursor:pointer}
#shelfG{transition:transform .6s ease}
#scene{touch-action:pan-y}
.bar{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.note{font-size:.85rem;color:var(--sub);text-align:center;margin-top:12px;line-height:1.7}
/* modal */
#dlg{z-index:26}
.dlgsheet{max-width:340px;text-align:center}
.dlgsheet p{font-size:1.05rem;line-height:1.8;margin:6px 0 16px;white-space:pre-line}
.dlgbtns{display:flex;gap:10px;justify-content:center}
.inv{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px;min-height:52px}
.inv .empty{font-size:.85rem;color:var(--sub)}
.item{width:50px;height:50px;border:2px solid var(--sub);border-radius:12px;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.5rem;position:relative;cursor:pointer;padding:0}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.item .n{position:absolute;right:3px;bottom:1px;font-size:.75rem;font-family:inherit}
.zoomsvg .hit.z{pointer-events:auto}
.gauge{position:relative;height:24px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:14px 0 6px;background:var(--bg)}
.gzone{position:absolute;right:0;top:0;bottom:0;width:10%;background:rgba(255,92,138,.3)}
.gfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#5aa9e6}
.gfill.max{background:var(--accent)}
.glabel{display:flex;justify-content:space-between;font-size:.8rem;color:var(--sub)}
#hk{transition:transform .5s cubic-bezier(.5,0,.9,.4)}
#gcake.wobble{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}}
.modal{position:fixed;inset:0;background:rgba(10,12,18,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--card);color:var(--ink);border-radius:14px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:18px;position:relative}
.sheet h2{font-size:1.1rem;font-weight:500;margin:0 0 12px}
.close{position:absolute;top:8px;right:8px;width:40px;height:40px;border:none;background:transparent;color:var(--ink);font-size:1.4rem;cursor:pointer;border-radius:50%}
.zoomsvg{border:3px solid var(--line);border-radius:6px;overflow:hidden;background:var(--wall)}
.zoomsvg svg{display:block;width:100%;height:auto}
.zoomsvg .hit{pointer-events:none}
.slots{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}
.slot{width:54px;text-align:center}
.slot svg{width:28px;height:28px}
.slot .ch{border-bottom:3px solid var(--ink);font-size:1.6rem;height:2.1rem;line-height:2.1rem}
.answer{width:100%;font:inherit;font-size:1.3rem;text-align:center;padding:.5em;border-radius:10px;border:2px solid var(--sub);background:var(--bg);color:var(--ink)}
.msg{min-height:1.5em;text-align:center;margin:10px 0;color:var(--accent)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.hintrow{border-top:1px dashed var(--sub);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.hintrow svg{flex:0 0 26px;height:26px}
.hintrow p{margin:0 0 8px;line-height:1.7;font-size:.95rem}
.hintrow .small{font-size:.85rem;padding:.35em .9em}
/* intro & clear */
.full{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
.full.hide{display:none}
.full .inner{max-width:420px;position:relative;z-index:2}
.full h2{font-size:1.6rem;font-weight:500;margin:0 0 14px;line-height:1.5}
.full p{line-height:1.9;margin:0 0 18px;white-space:pre-line}
.big{font-size:3rem;margin-bottom:8px}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards;z-index:1}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.shake{animation:none}}
</style>
</head>
<body>

<div class="full" id="intro">
  <div class="inner">
    <div class="big">🎂</div>
    <h2>誕生日の部屋に<br>閉じこめられた！</h2>
    <p>4つの★の文字を集めて、ドアを開けよう。
◀ ▶ で部屋を見回して、
気になるものはタップすると近くで見られます。</p>
    <button class="btn" id="startBtn">はじめる</button>
  </div>
</div>

<div class="full hide" id="clear">
  <div class="inner">
    <div class="big">🎉</div>
    <h2 id="clearTitle">脱出成功！</h2>
    <p id="clearMsg"></p>
    <p id="clearTime" style="color:var(--sub);font-size:.9rem"></p>
    <button class="btn ghost" id="againBtn">もう一度遊ぶ</button>
  </div>
</div>

<div class="wrap">
  <div class="top">
    <h1>誕生日の部屋からの脱出</h1>
    <span class="wallname" id="wallName"></span>
  </div>
  <div class="stage">
    <svg id="scene" viewBox="0 0 400 300" role="img" aria-label="部屋の壁"></svg>
    <button class="arrow l" id="leftBtn" aria-label="左を向く"><svg viewBox="0 0 44 56"><path d="M30 12L12 28L30 44" fill="none" stroke="#e53935" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="arrow r" id="rightBtn" aria-label="右を向く"><svg viewBox="0 0 44 56"><path d="M14 12L32 28L14 44" fill="none" stroke="#e53935" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="inv" id="invBar"></div>
  <div class="bar">
    <button class="btn ghost" id="hintBtn">ヒント</button>
    <button class="btn" id="doorBtn">ドアに答えを入れる</button>
  </div>
  <p class="note" id="note">気になるものはタップして調べよう</p>
</div>

<!-- zoom -->
<div class="modal" id="zoomModal" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="close" data-close aria-label="閉じる">×</button>
    <h2 id="zoomTitle">よく見る</h2>
    <div class="zoomsvg"><svg id="zoomSvg" viewBox="0 0 400 300"></svg></div>
  </div>
</div>

<!-- lock -->
<div class="modal" id="lockModal" role="dialog" aria-modal="true">
  <div class="sheet" id="lockSheet">
    <button class="close" data-close aria-label="閉じる">×</button>
    <h2>ドアの鍵</h2>
    <div class="slots" id="slots"></div>
    <input class="answer" id="answer" placeholder="ひらがな4文字" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="msg" id="lockMsg"></div>
    <div style="text-align:center"><button class="btn" id="openBtn">ドアを開ける</button></div>
  </div>
</div>

<!-- hanky game -->
<div class="modal" id="gameModal" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="close" data-close aria-label="閉じる">×</button>
    <h2>ハンカチ引き</h2>
    <p style="margin:0 0 10px;font-size:.95rem;line-height:1.7">ケーキを落とさないように、集中ゲージがMAXの瞬間に引こう！</p>
    <div class="zoomsvg"><svg id="gameSvg" viewBox="0 0 300 140">
      <rect width="300" height="140" fill="var(--wall)"/>
      <rect x="20" y="96" width="260" height="10" fill="#c9a77c" stroke="#111" stroke-width="2"/>
      <path d="M40 106V140M260 106V140" stroke="#111" stroke-width="4"/>
      <g id="hk"><polygon points="95,96 215,96 220,124 200,118 90,118" fill="#9fd3f0" stroke="#111" stroke-width="2" stroke-linejoin="round"/></g>
      <g id="gcake" style="transform-origin:150px 94px">
        <rect x="102" y="88" width="96" height="7" rx="3" fill="#fafafa" stroke="#111" stroke-width="2"/>
        <rect x="114" y="52" width="72" height="36" rx="4" fill="#fff6ea" stroke="#111" stroke-width="2.2"/>
        <path d="M114 62 Q123 70 132 62 Q141 70 150 62 Q159 70 168 62 Q177 70 186 62" fill="none" stroke="#f48fb1" stroke-width="3"/>
        <rect x="147" y="34" width="6" height="18" fill="#90caf9" stroke="#111" stroke-width="1.3"/>
        <path d="M150 22 Q155 28 150 33 Q145 28 150 22Z" fill="#ffb300"/>
      </g>
    </svg></div>
    <div class="gauge"><div class="gzone"></div><div class="gfill" id="gfill"></div></div>
    <div class="glabel"><span>集中ゲージ</span><span>MAX</span></div>
    <div class="msg" id="gameMsg"></div>
    <div style="text-align:center"><button class="btn" id="pullBtn">引く！</button></div>
  </div>
</div>

<!-- dialog -->
<div class="modal" id="dlg" role="dialog" aria-modal="true">
  <div class="sheet dlgsheet"><p id="dlgMsg"></p><div class="dlgbtns" id="dlgBtns"></div></div>
</div>

<!-- hints -->
<div class="modal" id="hintModal" role="dialog" aria-modal="true">
  <div class="sheet">
    <button class="close" data-close aria-label="閉じる">×</button>
    <h2>ヒント</h2>
    <div id="hintList"></div>
  </div>
</div>

<script>
/* ===== ここを書きかえると、クリア画面のメッセージを変えられます ===== */
const CONFIG = {
  name: "",   // 例："ゆいちゃん"
  message: "いつも本当にありがとう。\nこれからもずっと、なかよしでいてね！"
};
/* ================================================================ */

const ANSWER = "たのしめ";
const STARS = [
  {c:"#e53935", name:"赤"},
  {c:"#1e63d6", name:"青"},
  {c:"#2e9e44", name:"緑"},
  {c:"#f5c400", name:"黄"}
];
const WALLS = ["ドアの壁","本棚の壁","絵の壁","ケーキの壁"];
let wall = 0, dark = false, startTime = 0, hasKey = false, shelfOpen = false, rugFlipped = false, shelfSlid = false, memoState = 0, hasTack = false, selected = null, batteries = 0, gotBatA = false, pinkPopped = false, purplePopped = false, powered = false, hasHanky = false, dusted = false;

function star(cx,cy,r,color,sw){
  let p=[];
  for(let i=0;i<10;i++){
    const rad = i%2? r*0.45 : r;
    const a = -Math.PI/2 + i*Math.PI/5;
    p.push((cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1));
  }
  return `<polygon points="${p.join(" ")}" fill="none" stroke="${color}" stroke-width="${sw||2.2}" stroke-linejoin="round"/>`;
}
function cloud(x,y,s){
  s=s||1;
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" stroke="#111" stroke-width="1.4"><path d="M-9 4 a5 5 0 0 1 2-9 a6 6 0 0 1 11-1 a5 5 0 0 1 5 10 z"/></g>`;
}
function room(){
  return `<rect width="400" height="300" fill="var(--wall)"/>
  <polygon points="40,200 360,200 400,300 0,300" fill="var(--floor)"/>
  <path d="M40 0V200H360V0M40 200L0 300M360 200L400 300" fill="none" stroke="var(--line)" stroke-width="3.5" stroke-linecap="round"/>`;
}
function defs(){
  return `<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
}
const T = (x,y,t,size,fill,extra)=>`<text x="${x}" y="${y}" font-size="${size}" fill="${fill||'#111'}" text-anchor="middle" dominant-baseline="central" font-family="Kiwi Maru, sans-serif" ${extra||""}>${t}</text>`;

function wall0(){ // ドア
  let s="";
  // balloons
  if(!pinkPopped) s+=`<path d="M74 140 Q78 170 86 192" stroke="#777" stroke-width="1.2" fill="none"/><ellipse cx="74" cy="124" rx="13" ry="16" fill="#f7a8c8" stroke="#111" stroke-width="2"/>`;
  else s+=`<path d="M86 192 Q80 182 84 172" stroke="#777" stroke-width="1.2" fill="none"/><path d="M82 170 l-4 -3 M85 169 l2 -4" stroke="#f7a8c8" stroke-width="2.5" stroke-linecap="round"/>`;
  if(!purplePopped) s+=`<path d="M98 130 Q96 170 88 192" stroke="#777" stroke-width="1.2" fill="none"/><ellipse cx="98" cy="114" rx="13" ry="16" fill="#c9b6f2" stroke="#111" stroke-width="2"/>`;
  else s+=`<path d="M88 192 Q94 182 91 174" stroke="#777" stroke-width="1.2" fill="none"/><path d="M90 172 l-3 -4 M93 172 l3 -3" stroke="#c9b6f2" stroke-width="2.5" stroke-linecap="round"/>`;
  if(!pinkPopped) s+=`<rect class="hit" data-action="balloon" data-b="pink" x="58" y="106" width="28" height="38"/>`;
  if(!purplePopped) s+=`<rect class="hit" data-action="balloon" data-b="purple" x="84" y="96" width="30" height="38"/>`;
  // garland
  s+=`<path d="M60 28 Q200 62 340 28" stroke="#111" stroke-width="1.6" fill="none"/>`;
  const kana=["さ","が","し","て"], ts=[.17,.39,.61,.83];
  ts.forEach((t,i)=>{
    const x=(1-t)*(1-t)*60+2*(1-t)*t*200+t*t*340;
    const y=(1-t)*(1-t)*28+2*(1-t)*t*62+t*t*28;
    s+=`<polygon points="${x-15},${y} ${x+15},${y} ${x},${y+32}" fill="#5cbf6b" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>`;
    s+=T(x,y+11,kana[i],14,"#fff",'font-weight="500"');
  });
  s+=star(352,44,8,STARS[2].c,2.4);
  // door
  s+=`<rect x="165" y="85" width="70" height="115" fill="var(--door)" stroke="var(--line)" stroke-width="3.5"/>
  <circle cx="178" cy="148" r="4.5" fill="#111"/>`;
  STARS.forEach((st,i)=>{ s+=star(181+i*13,106,5.2,st.c,1.8); });
  s+=`<rect class="hit" data-action="door" x="160" y="80" width="80" height="122"/>`;
  s+=`<rect class="hit" data-zoom="40 10 330 80" data-title="ガーランド" x="55" y="20" width="305" height="60"/>`;
  return s;
}
function wall1(){ // 本棚（立体・鍵つき・スライド可）
  let s="";
  // drag marks (hidden when shelf is slid right)
  s+=`<g stroke="#9a9a92" stroke-linecap="round" fill="none">
    <path d="M294 218 Q311 217 328 219" stroke-width="2.2"/><path d="M296 222 Q310 222 324 223" stroke-width="1.4"/>
    <path d="M300 212 Q316 211 333 213" stroke-width="2"/>
    <path d="M312 150 L336 152M314 160 L332 161M311 176 L338 178M316 186 L334 186" stroke-width="1.6"/>
  </g>`;
  s+=T(130,113,"1",15,"#333")+T(130,152,"2",15,"#333")+T(130,186,"3",15,"#333");
  if(!gotBatA) s+=batterySvg(116,204)+`<rect class="hit" data-action="batA" x="110" y="196" width="34" height="26"/>`;
  const o = shelfSlid ? 40 : 0;
  s+=`<g id="shelfG" style="transform:translateX(${o}px)">`;
  // floor shadow
  s+=`<polygon points="110,222 290,222 306,200 126,200" fill="#000" opacity=".08"/>`;
  // top & side faces (back corner sits on the wall/floor line y=200)
  s+=`<polygon points="110,82 126,60 306,60 290,82" fill="#dcc09a" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="290,82 306,60 306,200 290,222" fill="#c39f73" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="110" y="82" width="180" height="140" fill="var(--wood)" stroke="var(--line)" stroke-width="3"/>`;
  s+=`<g transform="skewX(-10)" font-family="Times New Roman, serif">`+["Ⅰ","Ⅱ","Ⅲ","Ⅳ"].map((r,i)=>`<text x="${157+i*36+12.5}" y="72" font-size="12" fill="#4a3b2a" text-anchor="middle" dominant-baseline="central">${r}</text>`).join("")+`</g>`;
  if(!dusted){
    s+=`<polygon points="111,81 126,61 305,61 289,81" fill="#aaa497"/>`;
    for(let i=0;i<26;i++){ const x=128+((i*37)%170), y=64+((i*13)%15); s+=`<circle cx="${x}" cy="${y}" r="${1+(i%3)*0.6}" fill="#8e887b"/>`; }
  }
  if(!shelfOpen){
    s+=`<rect x="115" y="87" width="84" height="130" fill="#e6c9a2" stroke="#111" stroke-width="2"/>
    <rect x="201" y="87" width="84" height="130" fill="#e6c9a2" stroke="#111" stroke-width="2"/>
    <rect x="124" y="96" width="66" height="112" fill="none" stroke="#b08a5c" stroke-width="1.5"/>
    <rect x="210" y="96" width="66" height="112" fill="none" stroke="#b08a5c" stroke-width="1.5"/>
    <rect x="192" y="144" width="16" height="24" rx="3" fill="#f2cf5b" stroke="#111" stroke-width="2"/>
    <circle cx="200" cy="153" r="3" fill="#111"/><rect x="198.8" y="153" width="2.4" height="8" fill="#111"/>`;
  } else {
    s+=`<rect x="116" y="88" width="168" height="128" fill="#9c7448"/>
    <polygon points="116,88 128,96 128,208 116,216" fill="#7d5a35"/>
    <polygon points="116,88 284,88 272,96 128,96" fill="#86603a"/>`;
    const rows=[["そ","ら","い","ろ"],["ゆ","き","た","み"],["は","る","う","え"]];
    const tops=[96,136,176], bottoms=[132,172,212];
    const cols=["#f8bbd0","#b3e5fc","#d1c4e9","#ffe0b2","#c8e6c9","#ffccbc","#cfd8dc","#f0f4c3","#e1bee7","#b2dfdb","#ffcdd2","#dcedc8"];
    const hv=[3,6,1,5,7,2,4,0,5,1,4,3];
    rows.forEach((row,r)=>{
      row.forEach((k,j)=>{
        const x=134+j*36, top=tops[r]+hv[r*4+j], h=bottoms[r]-top;
        s+=`<rect x="${x}" y="${top}" width="30" height="${h}" rx="2" fill="${cols[r*4+j]}" stroke="#111" stroke-width="1.6"/>`;
        s+=T(x+15,top+h/2,k,15);
      });
      s+=`<rect x="116" y="${bottoms[r]}" width="168" height="4" fill="var(--wood)" stroke="#111" stroke-width="1.5"/>`;
    });
  }
  s+=`<rect class="hit" data-action="shelf" x="110" y="56" width="180" height="170"/>
  <polygon class="hit" data-action="push" points="290,82 306,60 318,60 318,200 290,226"/>
  <polygon class="hit" data-action="shelftop" points="106,86 124,54 310,54 292,86"/>`;
  s+=`</g>`;
  if(dark) s+=darkLayer()+`<g filter="url(#glow)">${T(74,112,"め",36,"#fff59d")}${star(74,146,9,"#ffe94d",2.4)}</g>`;
  return s;
}
function batterySvg(x,y){
  return `<g transform="translate(${x} ${y})"><rect x="0" y="0" width="22" height="11" rx="2" fill="#4a4a4a" stroke="#111" stroke-width="1.4"/><rect x="0" y="0" width="7" height="11" rx="2" fill="#d4a017" stroke="#111" stroke-width="1.4"/><rect x="22" y="3" width="3" height="5" fill="#bbb" stroke="#111" stroke-width="1"/></g>`;
}
function keySvg(x,y){
  return `<g transform="translate(${x} ${y})" stroke="#111" stroke-width="1.5"><circle cx="0" cy="0" r="6" fill="#f2cf5b"/><circle cx="0" cy="0" r="2.2" fill="var(--floor)"/><rect x="5" y="-1.8" width="20" height="3.6" fill="#f2cf5b"/><rect x="18" y="1.8" width="3" height="4" fill="#f2cf5b"/><rect x="22" y="1.8" width="3" height="5" fill="#f2cf5b"/></g>`;
}
function wall2(){ // 絵
  let s="";
  s+=cloud(140,22,1);
  // moon (ほ)
  s+=`<rect x="115" y="34" width="50" height="44" fill="#26346e" stroke="#111" stroke-width="2.5"/>
  <circle cx="137" cy="54" r="11" fill="#fff59d"/><circle cx="143" cy="50" r="10" fill="#26346e"/>
  <circle cx="155" cy="44" r="1.3" fill="#fff"/><circle cx="125" cy="70" r="1.2" fill="#fff"/>`;
  // sunrise (の)
  s+=`<rect x="175" y="34" width="50" height="44" fill="#ffd8c4" stroke="#111" stroke-width="2.5"/>
  <path d="M188 66 A12 12 0 0 1 212 66 Z" fill="#ff7043"/>
  <rect x="176.5" y="66" width="47" height="10.5" fill="#9ccc65"/>
  <path d="M200 50V45M189 55L186 51M211 55L214 51" stroke="#ff7043" stroke-width="2" stroke-linecap="round"/>`;
  // noon (み)
  s+=`<rect x="235" y="34" width="50" height="44" fill="#b3e5fc" stroke="#111" stroke-width="2.5"/>
  <circle cx="260" cy="48" r="9" fill="#ffca28"/>
  <rect x="236.5" y="66" width="47" height="10.5" fill="#9ccc65"/>`;
  s+=T(140,92,"ほ",17)+T(200,92,"の",17)+T(260,92,"み",17);
  s+=`<rect class="hit" data-zoom="100 8 200 98" data-title="3枚の絵" x="105" y="10" width="190" height="94"/>`;
  // red memo
  if(memoState===0){
    s+=`<rect x="58" y="118" width="64" height="50" fill="#efece1" stroke="var(--line)" stroke-width="2.5" transform="rotate(-4 90 143)"/>`;
  } else {
    s+=`<rect x="58" y="118" width="64" height="50" fill="var(--paper)" stroke="var(--line)" stroke-width="2.5" transform="rotate(-4 90 143)"/>`;
    s+=star(76,142,9,STARS[0].c,2.4)+T(104,143,"ニ-Ⅲ",15);
  }
  if(memoState<2){
    s+=`<circle cx="90" cy="122" r="5" fill="#ff80ab" stroke="#111" stroke-width="1.6"/><circle cx="88.5" cy="120.5" r="1.4" fill="#fff"/>`;
    s+=`<rect class="hit z" data-action="tack" x="80" y="112" width="20" height="20"/>`;
  }
  s+=`<rect class="hit" data-zoom="40 100 100 80" data-title="メモ" x="52" y="110" width="76" height="66"/>`;
  // rug
  s+=`<ellipse cx="200" cy="250" rx="110" ry="24" fill="#f3d9e4" stroke="#111" stroke-width="2"/>
  <ellipse cx="200" cy="250" rx="90" ry="16" fill="none" stroke="#e7a9c3" stroke-width="2" stroke-dasharray="5 4"/>`;
  if(rugFlipped && !hasKey) s+=keySvg(282,262);
  s+=`<rect class="hit" data-action="rug" x="88" y="224" width="226" height="54"/>`;
  if(rugFlipped && !hasKey) s+=`<rect class="hit z" data-action="key" x="270" y="250" width="40" height="24"/>`;
  // switch
  s+=switchSvg();
  return s;
}
function switchSvg(){
  let s=`<rect x="310" y="118" width="28" height="42" rx="4" fill="var(--paper)" stroke="var(--line)" stroke-width="2.5"/>
  <rect x="318" y="${dark?141:125}" width="12" height="13" rx="2" fill="#111"/>`;
  s+=star(324,172,6,STARS[3].c,2);
  s+=`<rect class="hit" data-action="switch" x="298" y="108" width="52" height="76"/>`;
  return s;
}
function wall3(){ // ケーキ
  let s="";
  s+=`<rect x="130" y="38" width="140" height="48" fill="var(--paper)" stroke="var(--line)" stroke-width="3.5"/>`;
  [160,200,240].forEach(x=>{ s+=`<circle cx="${x}" cy="62" r="14" fill="none" stroke="#111" stroke-width="2.6"/>`; });
  s+=star(160,62,8,STARS[1].c,2.2);
  s+=cloud(258,48,0.7);
  s+=`<rect class="hit" data-zoom="110 28 180 70" data-title="パネル" x="125" y="32" width="150" height="60"/>`;
  // table & cake (front view: candles hide each other)
  s+=`<rect x="140" y="170" width="120" height="7" fill="#c9a77c" stroke="#111" stroke-width="2"/>
  <path d="M152 177V215M248 177V215" stroke="#111" stroke-width="3"/>
  ${hasHanky?"":`<polygon points="152,170 257,170 261,194.5 244,189 147.5,189" fill="#9fd3f0" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>`}
  <rect x="158" y="166" width="84" height="5" rx="2" fill="#fafafa" stroke="#111" stroke-width="1.8"/>
  <rect x="168" y="144" width="64" height="23" rx="3" fill="#fff6ea" stroke="#111" stroke-width="2.2"/>
  <path d="M168 153 Q176 160 184 153 Q192 160 200 153 Q208 160 216 153 Q224 160 232 153" fill="none" stroke="#f48fb1" stroke-width="2.5"/>
  <rect x="197.5" y="130" width="5" height="16" fill="#90caf9" stroke="#111" stroke-width="1.2"/>
  <path d="M200 120 Q204 125 200 129 Q196 125 200 120Z" fill="#ffb300"/>`;
  // green card
  s+=`<rect x="244" y="136" width="112" height="38" fill="var(--paper)" stroke="var(--line)" stroke-width="2" transform="rotate(3 300 155)"/>`;
  s+=T(292,156,"ろうそくの数番目",11)+star(345,157,6.5,STARS[2].c,2.2);
  s+=`<rect class="hit" data-action="cake" x="140" y="112" width="218" height="74"/>`;
  if(!hasHanky) s+=`<rect class="hit" data-action="hanky" x="144" y="171" width="120" height="26"/>`;
  return s;
}
function cakeCloseup(){
  // directly from above
  let s=`<rect width="320" height="210" fill="#c9a77c"/>
  <path d="M0 70H320M0 140H320" stroke="#b08f66" stroke-width="2"/>
  ${hasHanky?"":`<polygon points="150,120 238,150 218,205 128,180" fill="#9fd3f0" stroke="#111" stroke-width="2"/>`}
  <circle cx="130" cy="105" r="92" fill="#fafafa" stroke="#111" stroke-width="2"/>
  <circle cx="130" cy="105" r="74" fill="#fff6ea" stroke="#111" stroke-width="2.4"/>
  <circle cx="130" cy="105" r="62" fill="none" stroke="#f48fb1" stroke-width="5" stroke-dasharray="8 7"/>`;
  [62,105,148].forEach(y=>{
    s+=`<circle cx="130" cy="${y}" r="7" fill="#90caf9" stroke="#111" stroke-width="1.6"/>
    <circle cx="130" cy="${y}" r="3.6" fill="#ffb300" stroke="#e08a00" stroke-width="1"/>`;
  });
  s+=`<g transform="rotate(4 265 105)"><rect x="212" y="86" width="106" height="38" fill="var(--paper)" stroke="#111" stroke-width="2"/></g>`;
  s+=T(258,105,"ろうそくの数番目",10.5)+star(308,108,6,STARS[2].c,2.2);
  return s;
}
function darkLayer(){ return `<rect width="400" height="300" fill="#0b0f1e" opacity=".92"/>`; }

function sceneContent(){
  let content = defs()+room()+[wall0,wall1,wall2,wall3][wall]();
  if(dark && wall!==1){
    content += darkLayer();
    if(wall===2) content += `<g filter="url(#glow)">${switchSvg()}</g>`;
  }
  return content;
}
function draw(){
  document.getElementById("scene").innerHTML=sceneContent();
  document.getElementById("wallName").textContent=WALLS[wall]+(dark?"（暗い）":"");
  renderInv();
}
function renderInv(){
  const items=[];
  if(hasKey && !shelfOpen) items.push(`<button class="item" data-item="key" aria-label="鍵">🔑</button>`);
  if(hasTack) items.push(`<button class="item${selected==="tack"?" sel":""}" data-item="tack" aria-label="画鋲">📌</button>`);
  if(hasHanky) items.push(`<button class="item${selected==="hanky"?" sel":""}" data-item="hanky" aria-label="ハンカチ"><svg viewBox="0 0 30 30" width="30" height="30"><path d="M5 7 L24 5 L26 24 L7 26 Z" fill="#9fd3f0" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 10 L22 9 L23 21 L10 22 Z" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 2"/></svg></button>`);
  if(batteries>0) items.push(`<button class="item" data-item="battery" aria-label="電池">🔋<span class="n">×${batteries}</span></button>`);
  document.getElementById("invBar").innerHTML = items.length ? items.join("") : `<span class="empty">持ち物はまだない</span>`;
  document.getElementById("note").textContent = selected==="tack" ? "画鋲を使う場所をタップしよう" : selected==="hanky" ? "ハンカチを使う場所をタップしよう" : "気になるものはタップして調べよう";
}
document.getElementById("invBar").addEventListener("click",e=>{
  const b=e.target.closest("[data-item]"); if(!b) return;
  const it=b.dataset.item;
  if(it==="tack"||it==="hanky"){ selected = selected===it ? null : it; renderInv(); return; }
  if(it==="key") return dialog("鍵。どこかの鍵穴に合いそう。");
  if(it==="battery") return dialog("電池。何かに使えそう。");
});
function dialog(msg,labels){
  labels=labels||["OK"];
  return new Promise(res=>{
    document.getElementById("dlgMsg").textContent=msg;
    const box=document.getElementById("dlgBtns");
    box.innerHTML=labels.map((l,i)=>`<button class="btn${i===labels.length-1?"":" ghost"}" data-i="${i}">${l}</button>`).join("");
    box.onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;document.getElementById("dlg").classList.remove("open");res(+b.dataset.i)};
    openModal("dlg");
  });
}
let lastZoom=null;
function showZoom(viewBox,title,content){
  lastZoom={viewBox,title,custom:!!content};
  const z=document.getElementById("zoomSvg");
  z.setAttribute("viewBox",viewBox);
  z.innerHTML=content||sceneContent();
  document.getElementById("zoomTitle").textContent=title;
  openModal("zoomModal");
}

function openModal(id){document.getElementById(id).classList.add("open")}
function closeModal(el){el.closest(".modal").classList.remove("open")}
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",e=>closeModal(e.target)));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("open")}));

document.getElementById("scene").addEventListener("click",e=>{
  const t=e.target.closest(".hit"); if(!t) return;
  const a=t.dataset.action;
  if(a==="door") return openLock();
  if(a==="switch") return useSwitch();
  if(a==="batA"){ gotBatA=true; batteries++; draw(); return dialog("電池を手に入れた！"); }
  if(a==="balloon") return useBalloon(t.dataset.b);
  if(a==="key") return getKey();
  if(a==="hanky") return openGame();
  if(a==="rug"){
    if(!rugFlipped){
      rugFlipped=true; draw();
      return showZoom("200 200 160 90","カーペットの下に鍵がある！");
    }
    return showZoom("80 200 240 90","カーペット");
  }
  if(a==="push"){ if(suppressClick){ suppressClick=false; return; } slideShelf(!shelfSlid); return; }
  if(a==="shelftop" || (a==="shelf" && selected==="hanky")){
    if(suppressClick){ suppressClick=false; return; }
    const vb=`${100+(shelfSlid?40:0)} 44 220 50`;
    if(selected==="hanky" && !dusted){ dusted=true; draw(); showZoom(vb,"本棚の上"); return dialog("ハンカチでほこりを拭いた。\n何か書いてある！"); }
    return showZoom(vb, dusted ? "本棚の上" : "ほこりがたまっている…");
  }
  if(a==="shelf"){
    if(suppressClick){ suppressClick=false; return; }
    const vb=`${80+(shelfSlid?40:0)} 50 250 182`;
    if(!shelfOpen && hasKey){ shelfOpen=true; draw(); return showZoom(vb,"鍵で本棚を開けた！"); }
    return showZoom(vb, shelfOpen ? "本棚" : "鍵がかかっている…");
  }
  if(a==="cake") return showZoom("0 0 320 210","ケーキ（真上から）",cakeCloseup());
  if(t.dataset.zoom) showZoom(t.dataset.zoom,t.dataset.title||"よく見る");
});

async function useSwitch(){
  if(powered){ dark=!dark; draw(); return; }
  if(batteries>=2){ batteries-=2; powered=true; draw(); return dialog("スイッチに電池を2個入れた。\nもう一度押すと使えそう。"); }
  dialog(`スイッチが動かない…\n電池が2個必要みたい。（持っている電池：${batteries}個）`);
}
function useBalloon(b){
  if(selected!=="tack") return showZoom("45 85 90 75","風船");
  if(b==="pink"){ pinkPopped=true; draw(); return dialog("パン！風船が割れた。\n中には何もなかった。"); }
  purplePopped=true; batteries++; hasTack=false; selected=null; draw();
  dialog("パン！風船が割れて、\n中から電池が出てきた！\n\n画鋲はどこかへ飛んでいってしまった…");
}
let gVal=0,gStart=0,gDone=false;
function openGame(){
  if(hasHanky) return;
  gDone=false; document.getElementById("gameMsg").textContent="";
  document.getElementById("hk").style.transform="";
  openModal("gameModal"); gStart=performance.now(); requestAnimationFrame(gLoop);
}
function gLoop(t){
  const m=document.getElementById("gameModal");
  if(!m.classList.contains("open")||gDone) return;
  const ph=((t-gStart)%1600)/1600;
  gVal=(ph<.5?ph*2:2-ph*2)*100;
  const f=document.getElementById("gfill");
  f.style.width=gVal+"%"; f.classList.toggle("max",gVal>=90);
  requestAnimationFrame(gLoop);
}
document.getElementById("pullBtn").onclick=()=>{
  if(gDone) return;
  const cake=document.getElementById("gcake"), msg=document.getElementById("gameMsg");
  if(gVal>=90){
    gDone=true;
    document.getElementById("hk").style.transform="translateX(260px)";
    msg.textContent="スパッ！";
    setTimeout(()=>{ document.getElementById("gameModal").classList.remove("open"); hasHanky=true; draw(); dialog("ハンカチを手に入れた！\nケーキは無事だ。"); },800);
  } else {
    msg.textContent="ケーキがぐらっ…！集中してもう一度";
    cake.classList.remove("wobble"); void cake.getBoundingClientRect(); cake.classList.add("wobble");
  }
};
function getKey(){ hasKey=true; draw(); refreshZoom(); dialog("鍵を手に入れた！"); }
async function useTack(){
  if(memoState===0){
    const r=await dialog("裏返しますか？",["いいえ","はい"]);
    if(r!==1) return;
    memoState=1;
  } else if(memoState===1){
    memoState=2; hasTack=true;
    draw(); refreshZoom();
    return dialog("画鋲を手に入れた！");
  }
  draw(); refreshZoom();
}
function refreshZoom(){ if(lastZoom && !lastZoom.custom && document.getElementById("zoomModal").classList.contains("open")) showZoom(lastZoom.viewBox,lastZoom.title); }
document.getElementById("zoomSvg").addEventListener("click",e=>{
  const t=e.target.closest(".hit.z"); if(!t) return;
  if(t.dataset.action==="tack") useTack();
  if(t.dataset.action==="key") getKey();
});

let suppressClick=false, dragX=null;
function slideShelf(v){
  shelfSlid=v;
  const g=document.getElementById("shelfG");
  if(g) g.style.transform=`translateX(${v?40:0}px)`;
}
const sceneEl=document.getElementById("scene");
sceneEl.addEventListener("pointerdown",e=>{
  const t=e.target.closest(".hit");
  dragX = (t && (t.dataset.action==="shelf"||t.dataset.action==="push")) ? e.clientX : null;
});
sceneEl.addEventListener("pointerup",e=>{
  if(dragX===null) return;
  const dx=e.clientX-dragX; dragX=null;
  if(Math.abs(dx)>20){ suppressClick=true; slideShelf(dx>0); setTimeout(()=>suppressClick=false,400); }
});
document.getElementById("leftBtn").onclick=()=>{wall=(wall+3)%4;draw()};
document.getElementById("rightBtn").onclick=()=>{wall=(wall+1)%4;draw()};

// lock
const slotsEl=document.getElementById("slots"), ans=document.getElementById("answer");
function toHira(s){return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s　]/g,"")}
function updateSlots(){
  const v=[...toHira(ans.value)];
  slotsEl.innerHTML=STARS.map((st,i)=>`<div class="slot"><svg viewBox="0 0 30 30">${star(15,15,12,st.c,2.4)}</svg><div class="ch">${v[i]||""}</div></div>`).join("");
}
ans.addEventListener("input",updateSlots);
function openLock(){ ans.value=""; document.getElementById("lockMsg").textContent=""; updateSlots(); openModal("lockModal"); setTimeout(()=>ans.focus(),50); }
document.getElementById("doorBtn").onclick=openLock;
document.getElementById("openBtn").onclick=check;
ans.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)check()});
function check(){
  const v=toHira(ans.value);
  const msg=document.getElementById("lockMsg"), sh=document.getElementById("lockSheet");
  if(v===ANSWER){ document.getElementById("lockModal").classList.remove("open"); win(); return; }
  msg.textContent = [...v].length!==4 ? "ひらがな4文字で入れてね" : "ドアは開かない…";
  sh.classList.remove("shake"); void sh.offsetWidth; sh.classList.add("shake");
}

// hints
const HINTS=[
  ["メモは裏返しで画鋲で止めてある。メモをタップして、画鋲を調べてみよう。","本棚の鍵はカーペットの下。本棚を右にずらすと、壁に段の番号が見えるよ。","本棚の上はほこりだらけ。ケーキのお皿の下のハンカチで拭いてみよう。ハンカチは集中ゲージがMAXの時に引くと取れるよ。","「ニ」は2段目、「Ⅲ」は本棚の上に書かれたⅢの列。その本の文字。"],
  ["青い★のパネルと同じ雲のマークが、絵の壁にもあるよ。","雲がついた夜の絵がパネルの右。時間の順に並べると左は朝。日の出の絵の下の文字。"],
  ["ケーキをタップして、真上から見てみよう。","ろうそくは縦に3本並んでいる。ドアの上のガーランドの3番目の文字。"],
  ["スイッチには電池が2個必要。1個は本棚を右に動かすと見つかるよ。","もう1個は風船の中。メモの画鋲を持ち物から選んで、風船をタップしよう。","電池を入れたら電気を消して、本棚の壁を見てみよう。"]
];
const hintLevel=[0,0,0,0];
function drawHints(){
  document.getElementById("hintList").innerHTML=STARS.map((st,i)=>{
    const shown=HINTS[i].slice(0,hintLevel[i]).map(h=>`<p>${h}</p>`).join("");
    const btn=hintLevel[i]<HINTS[i].length?`<button class="btn ghost small" data-h="${i}">${hintLevel[i]?"もっとヒント":"ヒントを見る"}</button>`:"";
    return `<div class="hintrow"><svg viewBox="0 0 30 30">${star(15,15,12,st.c,2.4)}</svg><div>${shown}${btn}</div></div>`;
  }).join("");
}
document.getElementById("hintList").addEventListener("click",e=>{const b=e.target.closest("[data-h]");if(!b)return;hintLevel[+b.dataset.h]++;drawHints()});
document.getElementById("hintBtn").onclick=()=>{drawHints();openModal("hintModal")};

// intro / clear
document.getElementById("startBtn").onclick=()=>{document.getElementById("intro").classList.add("hide");startTime=Date.now()};
function win(){
  const c=document.getElementById("clear");
  document.getElementById("clearTitle").textContent = "りんたろうタンオメ！";
  document.getElementById("clearMsg").textContent = "脱出成功！\n\n"+CONFIG.message;
  const sec=Math.round((Date.now()-startTime)/1000);
  document.getElementById("clearTime").textContent=`クリアタイム ${Math.floor(sec/60)}分${sec%60}秒`;
  c.querySelectorAll(".confetti").forEach(n=>n.remove());
  const cols=["#e53935","#1e63d6","#2e9e44","#f5c400","#ff5c8a","#9c6ade"];
  for(let i=0;i<70;i++){
    const d=document.createElement("span");d.className="confetti";
    d.style.left=Math.random()*100+"%";d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.5+Math.random()*2.5)+"s";d.style.animationDelay=(Math.random()*1.2)+"s";
    c.appendChild(d);
  }
  c.classList.remove("hide");
}
document.getElementById("againBtn").onclick=()=>{
  document.getElementById("clear").classList.add("hide");
  wall=0;dark=false;hasKey=false;shelfOpen=false;rugFlipped=false;shelfSlid=false;memoState=0;hasTack=false;hasHanky=false;dusted=false;selected=null;batteries=0;gotBatA=false;pinkPopped=false;purplePopped=false;powered=false;hintLevel.fill(0);draw();startTime=Date.now();
};
draw();
</script>
</body>
</html>
